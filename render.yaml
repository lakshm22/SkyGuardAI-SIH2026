services:
  - type: web
    name: skyguard-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: skyguard
      - key: SKYGUARD_ADMIN_USERNAME
        sync: false
      - key: SKYGUARD_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
